<section class="wknd-demo-weather" data-weather-component="wknd-demo" data-weather-url="${resource.path}.current.json">
    <h3>Weather · Bali, Indonesia</h3>
    <p data-weather-status role="status">Loading current weather…</p>
    <div data-weather-result hidden>
        <p class="wknd-demo-weather__temperature" data-weather-temperature></p>
        <p class="wknd-demo-weather__condition" data-weather-condition></p>
        <dl class="wknd-demo-weather__details">
            <div><dt>Humidity</dt><dd data-weather-humidity></dd></div>
            <div><dt>Wind</dt><dd data-weather-wind></dd></div>
        </dl>
        <p class="wknd-demo-weather__source" data-weather-source></p>
    </div>
</section>

<section data-sly-test="${currentPage.path == '/content/wknd/us/en/aem-demo/weather'}"
    class="wknd-system-logs" data-weather-docs="${resource.path}.weatherdocs.json">
    <h3>Weather diagnostics and source code</h3>
    <details data-weather-log>
        <summary>Weather log</summary>
        <pre tabindex="0" aria-label="Weather log"></pre>
    </details>
    <details data-weather-sources>
        <summary>Source code and component definitions</summary>
        <p>Dependency injection is defined by the OSGi annotations and generated service descriptors.</p>
        <div data-weather-files></div>
    </details>
</section>
